server.port=8084

spring.application.name=auth-service

spring.datasource.url=jdbc:oracle:thin:@//host.docker.internal:1521/orclpdb
spring.datasource.username=AUTH_APP
spring.datasource.password=auth123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.endpoint.prometheus.access=unrestricted

jwt.secret=MyVeryStrongSecretKeyForJwtAuthentication123456789
jwt.expiration=86400000