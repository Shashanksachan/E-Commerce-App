server.port=8082
spring.application.name=payment-service


#spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/ORCLPDB
spring.datasource.url=jdbc:oracle:thin:@//host.docker.internal:1521/orclpdb
spring.datasource.username=PAYMENT_APP
spring.datasource.password=payment123
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

management.prometheus.metrics.export.enabled=true
management.endpoint.prometheus.access=unrestricted


#trace id
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans