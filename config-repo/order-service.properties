server.port=8081
spring.application.name=order-service

message=Welcome from Config Server


#spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/orclpdb
spring.datasource.url=jdbc:oracle:thin:@//host.docker.internal:1521/orclpdb
spring.datasource.username=ORDER_APP
spring.datasource.password=order123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Payment Service URL
#payment.service.url=http://localhost:8082/payments
payment.service.url=http://payment-service:8082/payments

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Circuit Breaker
resilience4j.circuitbreaker.instances.paymentService.register-health-indicator=true
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.paymentService.automatic-transition-from-open-to-half-open-enabled=true

# Retry Configuration
resilience4j.retry.instances.paymentRetry.max-attempts=3
resilience4j.retry.instances.paymentRetry.wait-duration=2s

#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=kafka:9092

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

management.prometheus.metrics.export.enabled=true
management.endpoint.prometheus.access=unrestricted


#trace id
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans